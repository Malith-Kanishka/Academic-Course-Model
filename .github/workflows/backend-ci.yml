name: .NET Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/ACM.Backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/ACM.Backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/ACM.Backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
