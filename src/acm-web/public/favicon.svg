<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>

  <!-- Graduation cap base / mortarboard brim (ellipse) -->
  <ellipse cx="32" cy="27" rx="18" ry="5.5" fill="url(#cap-grad)" opacity="0.95"/>

  <!-- Cap top -->
  <polygon points="32,14 50,27 32,27 14,27" fill="url(#top-grad)"/>
  <polygon points="32,14 14,27 32,27" fill="url(#shadow-grad)" opacity="0.25"/>

  <!-- Tassel string -->
  <line x1="47" y1="26.5" x2="47" y2="37" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="47" cy="38.5" r="2.5" fill="#38bdf8"/>

  <!-- Neural network dots on the cap face to hint AI -->
  <circle cx="27" cy="27" r="1.4" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="32" cy="27" r="1.4" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="37" cy="27" r="1.4" fill="#e0f2fe" opacity="0.9"/>

  <!-- Stand / diploma tube below cap -->
  <rect x="27" y="32" width="10" height="14" rx="3" fill="url(#scroll-grad)" opacity="0.92"/>
  <line x1="27" y1="36" x2="37" y2="36" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27" y1="39" x2="37" y2="39" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27" y1="42" x2="37" y2="42" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Shine overlay -->
  <ellipse cx="23" cy="18" rx="8" ry="4" fill="white" opacity="0.08"/>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="cap-grad" x1="14" y1="27" x2="50" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="top-grad" x1="32" y1="14" x2="32" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="23" y1="14" x2="23" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="scroll-grad" x1="27" y1="32" x2="37" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
</svg>