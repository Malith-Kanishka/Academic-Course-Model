name: acm_mobile

description: The Grid mobile client for the Academic Course Model.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  provider: ^6.1.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.4

flutter:
  uses-material-design: true
